# Render blueprint for Fantasy Chess.
# Deploy: push this repo to GitHub, then in Render choose "New → Blueprint"
# and point it at the repo. Render creates the web service + Postgres below.
# FREE TEST TIER ($0): web plan "free" sleeps after 15 min idle (slow first
# load) and the free Postgres deletes itself after 30 days with 1 GB fixed
# storage. Good for testing only — not a launch.
# PAID LAUNCH (switch these two plans back when ready): web 0.5c-512mb
# ($7/mo) + Postgres 0.1c-256mb ($6/mo) + diskSizeGB 1 ($0.30/mo) = ~$13.30/mo.
# (Render retired the old "starter" Postgres plan in April 2026; the new plan
# IDs are 0.5c-512mb / 0.1c-256mb. Disk is billed separately at $0.30/GB/mo
# and can only grow, so start paid at 1 GB.)

services:
  - type: web
    name: fantasy-chess
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fantasy-chess-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_SETUP_TOKEN
        generateValue: true
      # PayPal: set these in the Render dashboard (Environment tab) with the
      # LIVE Client ID + Secret from the PayPal Developer dashboard, or leave
      # them unset and use the in-app Store Owner Setup panel instead.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: live
      # Public origin of the site, used for PayPal return/cancel URLs so
      # they are never built from the request Host header (a poisoned Host
      # could redirect the payer elsewhere after approval).
      - key: PUBLIC_URL
        value: https://fantasy-chess.onrender.com

databases:
  - name: fantasy-chess-db
    plan: free
