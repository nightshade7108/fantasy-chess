# Render blueprint for Fantasy Chess.
# Deploy: push this repo to GitHub, then in Render choose "New → Blueprint"
# and point it at the repo. Render creates the web service + Postgres below.
# Cost: web 0.5c-512mb ($7/mo) + Postgres 0.1c-256mb ($6/mo) + 1 GB disk
# ($0.30/mo) = ~$13.30/mo. (Render retired the old "starter" Postgres plan
# in April 2026; the new plan IDs are 0.5c-512mb / 0.1c-256mb. Disk is billed
# separately at $0.30/GB/mo and can only grow, so start at 1 GB.)
# The Free database deletes itself after 30 days — test-only, not for launch.

services:
  - type: web
    name: fantasy-chess
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: fantasy-chess-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: OWNER_SETUP_TOKEN
        generateValue: true
      # PayPal: set these in the Render dashboard (Environment tab) with the
      # LIVE Client ID + Secret from the PayPal Developer dashboard, or leave
      # them unset and use the in-app Store Owner Setup panel instead.
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_ENV
        value: live

databases:
  - name: fantasy-chess-db
    plan: 0.1c-256mb
    diskSizeGB: 1
